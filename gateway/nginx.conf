# Gateway de Buky-Mapas: única puerta pública de TileServer (8080) y GraphHopper (8081).
#   - responde desde la caché mientras TileServer se recarga y apunta al color
#     activo de GraphHopper, para actualizar datos sin cortar el servicio
#   - comprime JSON y glifos (los tiles .pbf ya vienen comprimidos desde el .mbtiles)
#   - Cache-Control por tipo de recurso, para navegadores y Cloudflare
#   - caché en disco: TileServer solo atiende lo que no está cacheado
#   - límite de peticiones por IP para el cálculo de rutas (CPU intensivo)
worker_processes auto;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # IP real del cliente detrás de Cloudflare (para el límite de peticiones)
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    # application/x-protobuf: glifos. Los tiles traen Content-Encoding y nginx no los recomprime.
    gzip_types application/json application/x-protobuf text/plain text/css text/xml
               application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;

    # ---------------------------------------------------------------- mapas
    proxy_cache_path /var/cache/nginx/maps levels=1:2 keys_zone=maps:32m max_size=2g
                     inactive=7d use_temp_path=off;

    # Tiles y fuentes cambian solo al regenerar datos; estilos y sprites, al publicar.
    map $uri $maps_cache_control {
        # CDN: 1 día como máximo, para que una actualización del mapa se vea al día siguiente
        "~^/data/[^/]+/\d+/\d+/\d+\.(pbf|png|webp|jpg)$" "public, max-age=86400, s-maxage=86400, stale-while-revalidate=604800";
        "~^/fonts/"                                    "public, max-age=604800, stale-while-revalidate=2592000";
        "~/sprite"                                     "public, max-age=3600, stale-while-revalidate=86400";
        "~^/health$"                                   "no-store";
        default                                        "public, max-age=300, stale-while-revalidate=86400";
    }

    # una instancia de TileServer: mientras se recarga, se responde desde la caché
    # (proxy_cache_use_stale) y la caché se vacía cuando el mapa nuevo ya responde
    upstream tileserver {
        server maps:8080;
        keepalive 32;
    }
    proxy_connect_timeout 2s;

    server {
        listen 8080;
        listen [::]:8080;

        location = /health {
            proxy_pass http://tileserver;
            add_header Cache-Control "no-store" always;
        }

        # estilos y TileJSON llevan URLs absolutas (MAPS_PUBLIC_URL): caché corta
        location ~ \.json$ {
            proxy_pass http://tileserver;
            proxy_cache maps;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 5m;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header Cache-Control $maps_cache_control always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://tileserver;
            proxy_cache maps;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 204 1d;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Set-Cookie;
            add_header Cache-Control $maps_cache_control always;
            add_header X-Cache-Status $upstream_cache_status always;
            # CORS lo envía TileServer; duplicar la cabecera hace que los navegadores la rechacen
        }
    }

    # ---------------------------------------------------------------- rutas
    limit_req_zone $client_ip zone=routing:10m rate=10r/s;
    limit_req_status 429;

    # color activo de GraphHopper (azul/verde); lo escribe scripts/update-routing.sh
    upstream graphhopper {
        include /etc/nginx/state/routing-upstream.conf;
        keepalive 16;
    }

    server {
        listen 8081;
        listen [::]:8081;
        client_max_body_size 1m;

        location = /health {
            proxy_pass http://graphhopper;
        }

        # cálculo de rutas: 10 por segundo por IP, con ráfagas de 20
        location ~ ^/(route|isochrone|spt|match|navigate) {
            limit_req zone=routing burst=20 nodelay;
            proxy_pass http://graphhopper;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }

        location / {
            limit_req zone=routing burst=40 nodelay;
            proxy_pass http://graphhopper;
            add_header Cache-Control "public, max-age=300" always;
        }
    }
}
